<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="VITALS — LCP · INP · CLS">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="92" font-weight="900" letter-spacing="-0.02em">VITALS</text><text x="58" y="235" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">CORE WEB VITALS · FULL-STACK PERF</text><rect x="68" y="273" width="320" height="300" rx="16" fill="#000000" stroke="none" stroke-width="0"/><rect x="60" y="265" width="320" height="300" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="60" y="265" width="320" height="50" rx="16" fill="#A8E63A" stroke="#000000" stroke-width="5"/><rect x="60" y="293" width="320" height="22" rx="0" fill="#A8E63A" stroke="none" stroke-width="0"/><text x="220" y="298" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="22" font-weight="900">LCP</text><path d="M 140 420 A 80 80 0 0 1 300 420" fill="none" stroke="#A894E0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M 140 420 A 80 80 0 0 1 268 356" fill="none" stroke="#A8E63A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="420" r="12" fill="#000000" stroke="#000000" stroke-width="0"/><line x1="220" y1="420" x2="265" y2="372" stroke="#000000" stroke-width="5" stroke-linecap="round"/><text x="220" y="490" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="28" font-weight="900">1.2s</text><rect x="184" y="514" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="180" y="510" width="72" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="216" y="532" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">GOOD</text><rect x="428" y="273" width="320" height="300" rx="16" fill="#000000" stroke="none" stroke-width="0"/><rect x="420" y="265" width="320" height="300" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="420" y="265" width="320" height="50" rx="16" fill="#A8E63A" stroke="#000000" stroke-width="5"/><rect x="420" y="293" width="320" height="22" rx="0" fill="#A8E63A" stroke="none" stroke-width="0"/><text x="580" y="298" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="22" font-weight="900">INP</text><path d="M 500 420 A 80 80 0 0 1 660 420" fill="none" stroke="#A894E0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M 500 420 A 80 80 0 0 1 628 356" fill="none" stroke="#A8E63A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="420" r="12" fill="#000000" stroke="#000000" stroke-width="0"/><line x1="580" y1="420" x2="625" y2="372" stroke="#000000" stroke-width="5" stroke-linecap="round"/><text x="580" y="490" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="28" font-weight="900">45ms</text><rect x="544" y="514" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="540" y="510" width="72" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="576" y="532" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">GOOD</text><rect x="788" y="273" width="320" height="300" rx="16" fill="#000000" stroke="none" stroke-width="0"/><rect x="780" y="265" width="320" height="300" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="780" y="265" width="320" height="50" rx="16" fill="#A8E63A" stroke="#000000" stroke-width="5"/><rect x="780" y="293" width="320" height="22" rx="0" fill="#A8E63A" stroke="none" stroke-width="0"/><text x="940" y="298" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="22" font-weight="900">CLS</text><path d="M 860 420 A 80 80 0 0 1 1020 420" fill="none" stroke="#A894E0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M 860 420 A 80 80 0 0 1 988 356" fill="none" stroke="#A8E63A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940" cy="420" r="12" fill="#000000" stroke="#000000" stroke-width="0"/><line x1="940" y1="420" x2="985" y2="372" stroke="#000000" stroke-width="5" stroke-linecap="round"/><text x="940" y="490" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="28" font-weight="900">0.01</text><rect x="904" y="514" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="900" y="510" width="72" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="936" y="532" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">GOOD</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#9BE7A3" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Perf</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">LCP · INP · CLS</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
