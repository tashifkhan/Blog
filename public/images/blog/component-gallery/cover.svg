<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="UI — COMPONENT GALLERY">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="100" font-weight="900" letter-spacing="-0.02em">UI</text><text x="58" y="240" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">EVERY BUILDING BLOCK · ONE POST</text><rect x="56" y="276" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="260" height="120" rx="14" fill="#A8E63A" stroke="#000000" stroke-width="5"/><text x="74" y="320" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Button</text><text x="74" y="358" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Button /&gt;</text><rect x="346" y="276" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="340" y="270" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="364" y="320" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Input</text><text x="364" y="358" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;TextField /&gt;</text><rect x="636" y="276" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="630" y="270" width="260" height="120" rx="14" fill="#F0E15C" stroke="#000000" stroke-width="5"/><text x="654" y="320" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Badge</text><text x="654" y="358" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Badge /&gt;</text><rect x="926" y="276" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="920" y="270" width="260" height="120" rx="14" fill="#9BE7A3" stroke="#000000" stroke-width="5"/><text x="944" y="320" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Tabs</text><text x="944" y="358" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Tabs /&gt;</text><rect x="56" y="436" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="430" width="260" height="120" rx="14" fill="#FF8F7A" stroke="#000000" stroke-width="5"/><text x="74" y="480" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Callout</text><text x="74" y="518" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Callout /&gt;</text><rect x="346" y="436" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="340" y="430" width="260" height="120" rx="14" fill="#7EC8FF" stroke="#000000" stroke-width="5"/><text x="364" y="480" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Steps</text><text x="364" y="518" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Steps /&gt;</text><rect x="636" y="436" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="630" y="430" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="654" y="480" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Code</text><text x="654" y="518" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;CodeBlock /&gt;</text><rect x="926" y="436" width="260" height="120" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="920" y="430" width="260" height="120" rx="14" fill="#E0D6FF" stroke="#000000" stroke-width="5"/><text x="944" y="480" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="24" font-weight="900">Diagram</text><text x="944" y="518" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="700" letter-spacing="0.04em">&lt;Mermaid /&gt;</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="77.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="77.2" height="34" rx="6" fill="#E0D6FF" stroke="#000000" stroke-width="3"/><text x="38.6" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Design</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">COMPONENT GALLERY</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
