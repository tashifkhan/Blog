<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PRISMA — ORM · SCHEMA · CLIENT">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="88" font-weight="900" letter-spacing="-0.02em">PRISMA</text><text x="58" y="235" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">SCHEMA · CLIENT · MIGRATIONS</text><rect x="57" y="277" width="360" height="290" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="360" height="290" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="50" y="270" width="360" height="50" rx="12" fill="#9BE7A3" stroke="#000000" stroke-width="5"/><rect x="50" y="298" width="360" height="22" rx="0" fill="#9BE7A3" stroke="none" stroke-width="0"/><text x="70" y="302" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="20" font-weight="900">model User</text><text x="80" y="360" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">id       String  @id</text><text x="80" y="398" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">email    String  @unique</text><text x="80" y="436" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">name     String?</text><text x="80" y="474" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">posts    Post[]</text><rect x="797" y="277" width="360" height="290" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="790" y="270" width="360" height="290" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="790" y="270" width="360" height="50" rx="12" fill="#7EC8FF" stroke="#000000" stroke-width="5"/><rect x="790" y="298" width="360" height="22" rx="0" fill="#7EC8FF" stroke="none" stroke-width="0"/><text x="810" y="302" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="20" font-weight="900">model Post</text><text x="820" y="360" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">id         String  @id</text><text x="820" y="398" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">title      String</text><text x="820" y="436" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">author     User @relation</text><text x="820" y="474" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">authorId   String</text><line x1="420" y1="410" x2="530" y2="410" stroke="#000000" stroke-width="6" stroke-linecap="round"/><line x1="670" y1="410" x2="780" y2="410" stroke="#000000" stroke-width="6" stroke-linecap="round"/><path d="M 600 350 L 660 460 L 540 460 Z" fill="#A8E63A" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="534" y="494" width="118.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="530" y="490" width="118.2" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="589.1" y="512" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">1.2ms QUERY</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="93.6" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="93.6" height="34" rx="6" fill="#9BE7A3" stroke="#000000" stroke-width="3"/><text x="46.8" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Database</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">ORM · SCHEMA · CLIENT</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
