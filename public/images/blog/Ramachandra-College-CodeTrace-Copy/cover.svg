<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CodeTrace Copy — Ramachandra College">
  <defs>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#FF4444"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid dark field -->
  <rect width="1200" height="630" fill="#1A1A2E"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#2A2A4A"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#FF4444" stroke-width="5"/>

  <!-- Main title -->
  <text x="600" y="140" text-anchor="middle"
		fill="#FF4444" stroke="#000000" stroke-width="8" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="72" font-weight="900" letter-spacing="-0.02em">UNATTRIBUTED FORK</text>

  <!-- Warning icon -->
  <g transform="translate(540, 180)">
    <path d="M 60 0 L 120 100 L 0 100 Z" fill="#FF4444" stroke="#000000" stroke-width="4"/>
    <text x="60" y="80" text-anchor="middle" fill="#000000"
		font-family="Impact, sans-serif"
		font-size="60" font-weight="900">!</text>
  </g>

  <!-- Source site -->
  <g transform="translate(80, 320)">
    <rect x="4" y="4" width="440" height="120" rx="12" fill="#000000" stroke="none"/>
    <rect x="0" y="0" width="440" height="120" rx="12" fill="#1E3A5F" stroke="#4A90D9" stroke-width="4"/>
    <text x="20" y="35" fill="#4A90D9"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="16" font-weight="900">ORIGINAL</text>
    <text x="20" y="70" fill="#FFFFFF"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="20" font-weight="800">codetrace.xyz</text>
    <text x="20" y="100" fill="#4A90D9"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600">MIT Licensed • by tashifkhan</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(540, 360)">
    <line x1="0" y1="20" x2="100" y2="20" stroke="#FF4444" stroke-width="6" stroke-linecap="round"/>
    <path d="M 95 10 L 120 20 L 95 30 Z" fill="#FF4444" stroke="#FF4444" stroke-width="2"/>
    <text x="50" y="60" text-anchor="middle" fill="#FF4444"
		font-family="ui-monospace, monospace"
		font-size="14" font-weight="800">FORKED</text>
  </g>

  <!-- Copied site -->
  <g transform="translate(680, 320)">
    <rect x="4" y="4" width="440" height="120" rx="12" fill="#000000" stroke="none"/>
    <rect x="0" y="0" width="440" height="120" rx="12" fill="#3A1A1A" stroke="#FF4444" stroke-width="4"/>
    <text x="20" y="35" fill="#FF4444"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="16" font-weight="900">UNATTRIBUTED FORK</text>
    <text x="20" y="70" fill="#FFFFFF"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="20" font-weight="800">sptracker1.vercel.app</text>
    <text x="20" y="100" fill="#FF4444"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600">No Attribution • PostHog Key Leaked</text>
  </g>

  <!-- Evidence chips -->
  <g transform="translate(80, 480)">
    <rect x="4" y="4" width="180" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="180" height="36" rx="6" fill="#FF4444" stroke="#000000" stroke-width="3"/>
    <text x="90" y="24" text-anchor="middle" fill="#FFFFFF"
		font-family="ui-monospace, monospace"
		font-size="13" font-weight="800">og:url LEAKED</text>
  </g>
  <g transform="translate(280, 480)">
    <rect x="4" y="4" width="200" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="200" height="36" rx="6" fill="#FF4444" stroke="#000000" stroke-width="3"/>
    <text x="100" y="24" text-anchor="middle" fill="#FFFFFF"
		font-family="ui-monospace, monospace"
		font-size="13" font-weight="800">POSTHOG KEY SAME</text>
  </g>
  <g transform="translate(500, 480)">
    <rect x="4" y="4" width="220" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#FF4444" stroke="#000000" stroke-width="3"/>
    <text x="110" y="24" text-anchor="middle" fill="#FFFFFF"
		font-family="ui-monospace, monospace"
		font-size="13" font-weight="800">CANONICAL → CODERTRACE</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FF4444" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#FFFFFF"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">RAMACHANDRA COLLEGE OF ENGINEERING</text>
  </g>

  <!-- Year chip -->
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none"/>
    <rect x="0" y="0" width="72" height="34" rx="6" fill="#FF4444" stroke="#000000" stroke-width="3"/>
    <text x="36" y="22" text-anchor="middle" fill="#FFFFFF"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2026</text>
  </g>

  <!-- Category chip -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="130" height="34" rx="6" fill="#000000" stroke="none"/>
    <rect x="0" y="0" width="130" height="34" rx="6" fill="#FF8800" stroke="#000000" stroke-width="3"/>
    <text x="65" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Open Source</text>
  </g>

  <!-- Corner mark -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#FF4444" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
