<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="IMPORT — sys.path · MODULES">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="88" font-weight="900" letter-spacing="-0.02em">IMPORT</text><text x="58" y="235" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">sys.path RESOLUTION · sys.modules CACHE</text><rect x="55" y="275" width="620" height="60" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="620" height="60" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="80" y="308" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="700" letter-spacing="0.04em">1. Current Directory  ./</text><rect x="55" y="345" width="620" height="60" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="340" width="620" height="60" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="80" y="378" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="700" letter-spacing="0.04em">2. PYTHONPATH Entries</text><rect x="55" y="415" width="620" height="60" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="410" width="620" height="60" rx="12" fill="#A8E63A" stroke="#000000" stroke-width="5"/><text x="80" y="448" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="900" letter-spacing="0.04em">3. site-packages/  ← HIT</text><rect x="524" y="426" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="520" y="422" width="72" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="556" y="444" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">MATCH</text><rect x="55" y="485" width="620" height="60" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="480" width="620" height="60" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="80" y="518" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="700" letter-spacing="0.04em">4. Standard Library /lib</text><line x1="700" y1="420" x2="766" y2="420" stroke="#000000" stroke-width="6" stroke-linecap="round"/><path d="M 764 411 L 780 420 L 764 429 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="807" y="307" width="350" height="250" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="800" y="300" width="350" height="250" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="800" y="300" width="350" height="48" rx="14" fill="#9BE7A3" stroke="#000000" stroke-width="5"/><rect x="800" y="326" width="350" height="22" rx="0" fill="#9BE7A3" stroke="none" stroke-width="0"/><text x="820" y="330" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="18" font-weight="900">sys.modules</text><text x="820" y="380" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="16" font-weight="800" letter-spacing="0.04em">[&apos;mypackage&apos;]</text><text x="820" y="420" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">• Cached object</text><text x="820" y="455" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">• O(1) lookup</text><rect x="824" y="494" width="93.6" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="820" y="490" width="93.6" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="866.8" y="512" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">RESOLVED</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="77.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="77.2" height="34" rx="6" fill="#9BE7A3" stroke="#000000" stroke-width="3"/><text x="38.6" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Python</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">sys.path · MODULES</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
