<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="YAML — TOKEN-LEAN PROMPTS">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="96" font-weight="900" letter-spacing="-0.02em">YAML</text><text x="58" y="240" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="16" font-weight="700" letter-spacing="0.04em">OVER JSON · TOKEN DENSITY</text><rect x="57" y="277" width="480" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="480" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="50" y="270" width="480" height="48" rx="14" fill="#FF8F7A" stroke="#000000" stroke-width="5"/><rect x="50" y="296" width="480" height="22" rx="0" fill="#FF8F7A" stroke="none" stroke-width="0"/><text x="70" y="302" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="18" font-weight="900">JSON · HEAVY</text><text x="80" y="345" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">{</text><text x="80" y="371" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">  &quot;system&quot;: &quot;assistant&quot;,</text><text x="80" y="397" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">  &quot;temperature&quot;: 0.7,</text><text x="80" y="423" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">  &quot;messages&quot;: [</text><text x="80" y="449" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">    {&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;hi&quot;}</text><text x="80" y="475" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">  ]</text><text x="80" y="501" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="600" letter-spacing="0.04em">}</text><rect x="74" y="519" width="110" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="70" y="515" width="110" height="34" rx="6" fill="#FF8F7A" stroke="#000000" stroke-width="3"/><text x="125" y="537" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">142 TOKENS</text><rect x="677" y="277" width="480" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="670" y="270" width="480" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="670" y="270" width="480" height="48" rx="14" fill="#A8E63A" stroke="#000000" stroke-width="5"/><rect x="670" y="296" width="480" height="22" rx="0" fill="#A8E63A" stroke="none" stroke-width="0"/><text x="690" y="302" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="18" font-weight="900">YAML · LEAN</text><text x="700" y="350" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="600" letter-spacing="0.04em">system: assistant</text><text x="700" y="380" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="600" letter-spacing="0.04em">temperature: 0.7</text><text x="700" y="410" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="600" letter-spacing="0.04em">messages:</text><text x="700" y="440" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="600" letter-spacing="0.04em">  - role: user</text><text x="700" y="470" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="600" letter-spacing="0.04em">    content: hi</text><rect x="694" y="519" width="118.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="690" y="515" width="118.2" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="749.1" y="537" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">−35% TOKENS</text><circle cx="600" cy="410" r="42" fill="#F0E15C" stroke="#000000" stroke-width="5"/><text x="600" y="418" text-anchor="middle" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="22" font-weight="900">VS</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="93.6" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="93.6" height="34" rx="6" fill="#E0D6FF" stroke="#000000" stroke-width="3"/><text x="46.8" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">AI / LLM</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">TOKEN-LEAN PROMPTS</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
