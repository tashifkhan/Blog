<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SSR — SSG · ISR · CSR">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="100" font-weight="900" letter-spacing="-0.02em">SSR</text><text x="58" y="240" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="16" font-weight="700" letter-spacing="0.04em">SSG · SSR · ISR · CSR</text><rect x="58" y="278" width="1100" height="290" rx="16" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="1100" height="290" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="6"/><text x="80" y="330" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">SSG  Static Generation</text><rect x="420" y="300" width="680" height="44" rx="8" fill="#C4B5F0" stroke="#000000" stroke-width="3"/><rect x="420" y="300" width="200" height="44" rx="8" fill="#A8E63A" stroke="#000000" stroke-width="4"/><text x="520" y="328" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Build Time</text><text x="80" y="390" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">SSR  Server-Side</text><rect x="420" y="360" width="680" height="44" rx="8" fill="#C4B5F0" stroke="#000000" stroke-width="3"/><rect x="560" y="360" width="200" height="44" rx="8" fill="#7EC8FF" stroke="#000000" stroke-width="4"/><text x="660" y="388" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">On Request</text><text x="80" y="450" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">ISR  Incremental</text><rect x="420" y="420" width="680" height="44" rx="8" fill="#C4B5F0" stroke="#000000" stroke-width="3"/><rect x="700" y="420" width="200" height="44" rx="8" fill="#9BE7A3" stroke="#000000" stroke-width="4"/><text x="800" y="448" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Build + Revalidate</text><text x="80" y="510" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">CSR  Client-Side</text><rect x="420" y="480" width="680" height="44" rx="8" fill="#C4B5F0" stroke="#000000" stroke-width="3"/><rect x="840" y="480" width="200" height="44" rx="8" fill="#FF8F7A" stroke="#000000" stroke-width="4"/><text x="940" y="508" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Browser Hydration</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Web</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">SSG · ISR · CSR</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
