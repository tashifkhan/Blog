		font-size="14" font-weight="800" letter-spacing="0.04em">BLOB 8e3a</text><line x1="500" y1="400" x2="505" y2="470" stroke="#000000" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="400" x2="695" y2="470" stroke="#000000" stroke-width="3" stroke-linecap="round"/></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="85.4" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="85.4" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="42.7" y="22" text-anchor="middle" fill="#000000"
