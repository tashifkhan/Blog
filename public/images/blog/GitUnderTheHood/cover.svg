  <g><text x="60" y="200" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="110" font-weight="900" letter-spacing="-0.02em">GIT</text><text x="70" y="245" text-anchor="start" fill="#0F0C1A"
