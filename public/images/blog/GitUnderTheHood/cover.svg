		font-size="15" font-weight="900" letter-spacing="0.04em">d710</text><circle cx="686" cy="366" r="40" fill="#000000" stroke="none" stroke-width="0"/><circle cx="680" cy="360" r="40" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="680" y="366" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="900" letter-spacing="0.04em">a38f</text><circle cx="866" cy="366" r="48" fill="#000000" stroke="none" stroke-width="0"/><circle cx="860" cy="360" r="48" fill="#A8E63A" stroke="#000000" stroke-width="5"/><text x="860" y="366" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
