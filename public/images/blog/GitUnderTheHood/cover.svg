		font-size="16" font-weight="700" letter-spacing="0.04em">OBJECTS · DAG · REFS</text><line x1="140" y1="360" x2="860" y2="360" stroke="#000000" stroke-width="8" stroke-linecap="round"/><path d="M 320 360 L 400 230 L 600 230 L 680 360" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="435" cy="235" r="36" fill="#000000" stroke="none" stroke-width="0"/><circle cx="430" cy="230" r="36" fill="#F0E15C" stroke="#000000" stroke-width="5"/><text x="430" y="236" text-anchor="middle" fill="#000000"
