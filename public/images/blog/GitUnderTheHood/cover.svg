		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="900" letter-spacing="0.04em">782a</text><rect x="504" y="144" width="126.4" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="500" y="140" width="126.4" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="563.2" y="162" text-anchor="middle" fill="#000000"
