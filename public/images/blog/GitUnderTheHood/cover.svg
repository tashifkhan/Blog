		font-size="13" font-weight="800" letter-spacing="0.04em">feature/auth</text><circle cx="146" cy="366" r="40" fill="#000000" stroke="none" stroke-width="0"/><circle cx="140" cy="360" r="40" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><text x="140" y="366" text-anchor="middle" fill="#000000"
