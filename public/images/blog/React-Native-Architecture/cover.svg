<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="JSI — BRIDGE → NEW ARCH">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="100" font-weight="900" letter-spacing="-0.02em">JSI</text><text x="58" y="240" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">OLD BRIDGE  →  NEW ARCHITECTURE</text><rect x="57" y="277" width="500" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="500" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="50" y="270" width="500" height="52" rx="14" fill="#FF8F7A" stroke="#000000" stroke-width="5"/><rect x="50" y="300" width="500" height="22" rx="0" fill="#FF8F7A" stroke="none" stroke-width="0"/><text x="70" y="304" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="20" font-weight="900">OLD · BRIDGE</text><rect x="95" y="355" width="180" height="140" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="90" y="350" width="180" height="140" rx="12" fill="#C4B5F0" stroke="#000000" stroke-width="4"/><text x="180" y="430" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="26" font-weight="900" letter-spacing="0.04em">JS</text><rect x="335" y="355" width="180" height="140" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="330" y="350" width="180" height="140" rx="12" fill="#C4B5F0" stroke="#000000" stroke-width="4"/><text x="420" y="430" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="900" letter-spacing="0.04em">NATIVE</text><line x1="280" y1="420" x2="320" y2="420" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="164" y="514" width="159.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="160" y="510" width="159.2" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="239.6" y="532" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">ASYNC JSON QUEUE</text><rect x="657" y="277" width="500" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="650" y="270" width="500" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="650" y="270" width="500" height="52" rx="14" fill="#A8E63A" stroke="#000000" stroke-width="5"/><rect x="650" y="300" width="500" height="22" rx="0" fill="#A8E63A" stroke="none" stroke-width="0"/><text x="670" y="304" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="20" font-weight="900">NEW · JSI</text><rect x="695" y="355" width="180" height="140" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="690" y="350" width="180" height="140" rx="12" fill="#A8E63A" stroke="#000000" stroke-width="4"/><text x="780" y="430" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="26" font-weight="900" letter-spacing="0.04em">JS</text><rect x="935" y="355" width="180" height="140" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="930" y="350" width="180" height="140" rx="12" fill="#9BE7A3" stroke="#000000" stroke-width="4"/><text x="1020" y="430" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="26" font-weight="900" letter-spacing="0.04em">C++</text><line x1="880" y1="390" x2="920" y2="390" stroke="#000000" stroke-width="6" stroke-linecap="round"/><line x1="920" y1="440" x2="880" y2="440" stroke="#000000" stroke-width="6" stroke-linecap="round"/><rect x="764" y="514" width="142.8" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="760" y="510" width="142.8" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="831.4" y="532" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">SYNC C++ CALLS</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="77.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="77.2" height="34" rx="6" fill="#7EC8FF" stroke="#000000" stroke-width="3"/><text x="38.6" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Mobile</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">BRIDGE → NEW ARCH</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
