<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PKL.WASM — PYODIDE · SKLEARN · ONNXRUNTIME-WEB">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid sky field -->
  <rect width="1200" height="630" fill="#A3C9F1"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#7FA8D9"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art: two paths, one heavy box and one light box -->
  <g>
    <text x="60" y="200" text-anchor="start"
      fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
      font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
      font-size="110" font-weight="900" letter-spacing="-0.02em">PKL.WASM</text>
    <text x="70" y="245" text-anchor="start" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="16" font-weight="700" letter-spacing="0.04em">PYODIDE · SKLEARN 1.8 · ONNXRUNTIME-WEB</text>

    <!-- path A: .pkl chip -->
    <rect x="84" y="334" width="76" height="34" rx="6" fill="#000000"/>
    <rect x="80" y="330" width="76" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="118" y="352" text-anchor="middle" fill="#000000"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="13" font-weight="800" letter-spacing="0.04em">.pkl</text>

    <line x1="158" y1="347" x2="252" y2="356" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 349 L 268 357 L 250 364 Z" fill="#000000"/>

    <!-- path A: heavy box -->
    <rect x="276" y="306" width="340" height="130" rx="10" fill="#000000"/>
    <rect x="270" y="300" width="340" height="130" rx="10" fill="#C4B5F0" stroke="#000000" stroke-width="5"/>
    <text x="440" y="358" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="17" font-weight="900" letter-spacing="0.04em">PYODIDE + SKLEARN</text>
    <text x="440" y="388" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="14" font-weight="700" letter-spacing="0.04em">1303 ms · pickle.loads()</text>

    <!-- path B: .onnx chip -->
    <rect x="84" y="464" width="92" height="34" rx="6" fill="#000000"/>
    <rect x="80" y="460" width="92" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/>
    <text x="126" y="482" text-anchor="middle" fill="#000000"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="13" font-weight="800" letter-spacing="0.04em">.onnx</text>

    <line x1="174" y1="477" x2="252" y2="476" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 469 L 268 476 L 250 484 Z" fill="#000000"/>

    <!-- path B: light box -->
    <rect x="276" y="450" width="210" height="64" rx="10" fill="#000000"/>
    <rect x="270" y="445" width="210" height="64" rx="10" fill="#A8E63A" stroke="#000000" stroke-width="5"/>
    <text x="375" y="473" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="15" font-weight="900" letter-spacing="0.04em">ORT-WEB</text>
    <text x="375" y="494" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="12" font-weight="700" letter-spacing="0.04em">14 ms · wasm / webgpu</text>

    <!-- right side: the browser tab both land in -->
    <rect x="706" y="316" width="264" height="184" rx="12" fill="#000000"/>
    <rect x="700" y="310" width="264" height="184" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
    <line x1="700" y1="346" x2="964" y2="346" stroke="#000000" stroke-width="4"/>
    <circle cx="722" cy="328" r="6" fill="#E35D4F" stroke="#000000" stroke-width="2"/>
    <circle cx="742" cy="328" r="6" fill="#F0E15C" stroke="#000000" stroke-width="2"/>
    <circle cx="762" cy="328" r="6" fill="#A8E63A" stroke="#000000" stroke-width="2"/>
    <text x="832" y="404" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="15" font-weight="900" letter-spacing="0.04em">your tab</text>
    <text x="832" y="430" text-anchor="middle" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="12" font-weight="700" letter-spacing="0.04em">bias: left / right</text>

    <!-- arrows into the browser -->
    <line x1="616" y1="365" x2="688" y2="380" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 684 373 L 700 382 L 682 389 Z" fill="#000000"/>
    <line x1="486" y1="477" x2="688" y2="440" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <path d="M 682 431 L 700 438 L 681 447 Z" fill="#000000"/>
  </g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="118" height="34" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="118" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/>
    <text x="59" y="22" text-anchor="middle" fill="#000000"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="13" font-weight="800" letter-spacing="0.04em">Frontend ML</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="36" y="22" text-anchor="middle" fill="#000000"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="13" font-weight="800" letter-spacing="0.04em">2026</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="300" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="300" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
      font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
      font-size="14" font-weight="800" letter-spacing="0.04em">1303 MS VS 14 MS · PICKLE ≈ EVAL</text>
  </g>

  <!-- Brutalist corner mark -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
