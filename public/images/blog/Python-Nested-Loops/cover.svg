<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="N×M — NESTED ITERATION">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="200" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="96" font-weight="900" letter-spacing="-0.02em">N×M</text><text x="58" y="245" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">OUTER × INNER · ARBITRARY DEPTH</text><rect x="88" y="258" width="1040" height="310" rx="16" fill="#000000" stroke="none" stroke-width="0"/><rect x="80" y="250" width="1040" height="310" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="6"/><rect x="80" y="250" width="1040" height="48" rx="16" fill="#FF8F7A" stroke="#000000" stroke-width="6"/><rect x="80" y="278" width="1040" height="20" rx="0" fill="#FF8F7A" stroke="none" stroke-width="0"/><text x="110" y="282" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">for i in range(rows):</text><rect x="140" y="320" width="920" height="210" rx="12" fill="#C4B5F0" stroke="#000000" stroke-width="5"/><text x="170" y="355" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="16" font-weight="800" letter-spacing="0.04em">for j in range(cols):</text><path d="M 240 400 L 350 400 L 460 400 L 570 400 L 680 400 L 790 400 L 900 400 L 900 448 L 790 448 L 680 448 L 570 448 L 460 448 L 350 448 L 240 448 L 240 496 L 350 496 L 460 496 L 570 496 L 680 496 L 790 496 L 900 496" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><circle cx="240" cy="400" r="14" fill="#A8E63A" stroke="#000000" stroke-width="4"/><circle cx="350" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="460" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="570" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="680" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="790" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="900" cy="400" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="240" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="350" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="460" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="570" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="680" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="790" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="900" cy="448" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="240" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="350" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="460" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="570" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="680" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="790" cy="496" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><circle cx="900" cy="496" r="14" fill="#FF8F7A" stroke="#000000" stroke-width="4"/><rect x="984" y="524" width="93.6" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="980" y="520" width="93.6" height="34" rx="6" fill="#A8E63A" stroke="#000000" stroke-width="3"/><text x="1026.8" y="542" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">O(N × M)</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="110" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="110" height="34" rx="6" fill="#F0E15C" stroke="#000000" stroke-width="3"/><text x="55" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Algorithms</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">NESTED ITERATION</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
