<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="REFS — STACK · HEAP · IDS">
  <defs>
    <!-- Halftone dots (sleeck poster texture) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.12"/>
    </pattern>
    <!-- Diagonal lime/white stripes (corner accent) -->
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#A8E63A"/>
      <rect x="14" width="14" height="28" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Solid lavender field -->
  <rect width="1200" height="630" fill="#C4B5F0"/>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Top-left stripe wedge -->
  <path d="M 0 0 L 420 0 L 280 180 L 0 180 Z" fill="url(#stripes)" stroke="#000000" stroke-width="0"/>
  <path d="M 0 180 L 280 180 L 240 220 L 0 220 Z" fill="#A894E0"/>

  <!-- Outer hard frame -->
  <rect x="16" y="16" width="1168" height="598" rx="8" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Art (titles sit in the field; chrome overlays on top like ProjectCover) -->
  <g><text x="50" y="195" text-anchor="start"
		fill="#000000" stroke="#FFFFFF" stroke-width="10" paint-order="stroke fill"
		font-family="Impact, Haettenschweiler, 'Arial Black', 'Helvetica Neue', sans-serif"
		font-size="96" font-weight="900" letter-spacing="-0.02em">REFS</text><text x="58" y="235" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">STACK POINTERS · HEAP OBJECTS</text><rect x="57" y="277" width="380" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="50" y="270" width="380" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="50" y="270" width="380" height="48" rx="14" fill="#7EC8FF" stroke="#000000" stroke-width="5"/><rect x="50" y="296" width="380" height="22" rx="0" fill="#7EC8FF" stroke="none" stroke-width="0"/><text x="70" y="300" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="18" font-weight="900">STACK</text><rect x="84" y="344" width="320" height="56" rx="10" fill="#000000" stroke="none" stroke-width="0"/><rect x="80" y="340" width="320" height="56" rx="10" fill="#A8E63A" stroke="#000000" stroke-width="4"/><text x="100" y="376" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">a = [1, 2, 3]</text><rect x="84" y="419" width="320" height="56" rx="10" fill="#000000" stroke="none" stroke-width="0"/><rect x="80" y="415" width="320" height="56" rx="10" fill="#A8E63A" stroke="#000000" stroke-width="4"/><text x="100" y="451" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">b = a</text><rect x="84" y="494" width="320" height="56" rx="10" fill="#000000" stroke="none" stroke-width="0"/><rect x="80" y="490" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="100" y="526" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="18" font-weight="800" letter-spacing="0.04em">c = [1, 2, 3]</text><line x1="450" y1="365" x2="546.13" y2="351.89" stroke="#000000" stroke-width="5" stroke-linecap="round"/><path d="M 542.93 343.24 L 560 350 L 545.36 361.08 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="450" y1="440" x2="547.71" y2="386.7" stroke="#000000" stroke-width="5" stroke-linecap="round"/><path d="M 541.64 379.76 L 560 380 L 550.26 395.56 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="450" y1="515" x2="546.13" y2="501.89" stroke="#000000" stroke-width="5" stroke-linecap="round"/><path d="M 542.93 493.24 L 560 500 L 545.36 511.08 Z" fill="#000000" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="587" y="277" width="560" height="290" rx="14" fill="#000000" stroke="none" stroke-width="0"/><rect x="580" y="270" width="560" height="290" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5"/><rect x="580" y="270" width="560" height="48" rx="14" fill="#F0E15C" stroke="#000000" stroke-width="5"/><rect x="580" y="296" width="560" height="22" rx="0" fill="#F0E15C" stroke="none" stroke-width="0"/><text x="600" y="300" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="18" font-weight="900">HEAP</text><rect x="615" y="345" width="500" height="110" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="610" y="340" width="500" height="110" rx="12" fill="#A8E63A" stroke="#000000" stroke-width="4"/><text x="630" y="375" text-anchor="start" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="800" letter-spacing="0.04em">id: 0x7F8B2C</text><text x="630" y="410" text-anchor="start" fill="#000000"
		font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
		font-size="20" font-weight="900">list  [1, 2, 3]</text><text x="630" y="435" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="700" letter-spacing="0.04em">refcount: 2  ·  SHARED</text><rect x="615" y="475" width="500" height="70" rx="12" fill="#000000" stroke="none" stroke-width="0"/><rect x="610" y="470" width="500" height="70" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="630" y="515" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="15" font-weight="700" letter-spacing="0.04em">id: 0x9E410A  ·  distinct object</text></g>

  <!-- Category + year chips ABOVE art so they never get painted over -->
  <g transform="translate(40, 36)">
    <rect x="4" y="4" width="77.2" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="77.2" height="34" rx="6" fill="#7EC8FF" stroke="#000000" stroke-width="3"/><text x="38.6" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">Python</text>
  </g>
  <g transform="translate(1050, 36)">
    <rect x="4" y="4" width="72" height="34" rx="6" fill="#000000" stroke="none" stroke-width="0"/><rect x="0" y="0" width="72" height="34" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/><text x="36" y="22" text-anchor="middle" fill="#000000"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="13" font-weight="800" letter-spacing="0.04em">2025</text>
  </g>

  <!-- Bottom caption bar -->
  <g transform="translate(40, 560)">
    <rect x="4" y="4" width="520" height="36" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="520" height="36" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <text x="16" y="24" text-anchor="start" fill="#0F0C1A"
		font-family="ui-monospace, SFMono-Regular, 'Geist Mono', Menlo, monospace"
		font-size="14" font-weight="800" letter-spacing="0.04em">STACK · HEAP · IDS</text>
  </g>

  <!-- Brutalist corner mark (sleeck ProjectCover) -->
  <g transform="translate(1110, 540)">
    <rect x="6" y="6" width="48" height="48" fill="#000000"/>
    <rect x="0" y="0" width="48" height="48" fill="#A8E63A" stroke="#000000" stroke-width="4"/>
    <rect x="10" y="10" width="28" height="28" fill="none" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
