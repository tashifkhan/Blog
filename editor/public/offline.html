<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#141310" />
    <title>Pressroom — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3efe4;
        --ink: #171711;
        --ink-soft: #5d5a50;
        --red: #c43d2f;
        --white: #fffdf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141310;
          --ink: #f0ebe0;
          --ink-soft: #a39e90;
          --red: #e05a4a;
          --white: #1a1814;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          'DM Sans',
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(196, 61, 47, 0.08), transparent 40%),
          var(--paper);
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
        background: color-mix(in srgb, var(--white) 88%, transparent);
        box-shadow: 8px 8px 0 color-mix(in srgb, var(--ink) 8%, transparent);
      }
      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        margin-bottom: 28px;
        place-items: center;
        color: var(--paper);
        background: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.9rem;
        font-weight: 700;
        transform: rotate(-2deg);
        box-shadow: 5px 5px 0 var(--red);
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--red);
        font-size: 0.69rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2rem, 6vw, 2.8rem);
        font-weight: 560;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      p {
        margin: 0 0 24px;
        color: var(--ink-soft);
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        padding: 12px 18px;
        color: var(--paper);
        background: var(--ink);
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      button:hover {
        background: var(--red);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <p class="eyebrow">Pressroom</p>
      <h1>You’re offline.</h1>
      <p>
        The desk needs a network to sign in and publish. Reconnect, then open
        Pressroom again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
